<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background rounded box -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  
  <!-- Notepad Paper -->
  <rect x="22" y="18" width="56" height="64" rx="8" fill="#ffffff" />
  
  <!-- Spiral or Top Binder Tabs -->
  <circle cx="34" cy="22" r="3" fill="#cbd5e1" />
  <circle cx="50" cy="22" r="3" fill="#cbd5e1" />
  <circle cx="66" cy="22" r="3" fill="#cbd5e1" />

  <!-- Note Lines -->
  <rect x="30" y="34" width="36" height="5" rx="2.5" fill="#6366f1" opacity="0.85" />
  <rect x="30" y="45" width="28" height="5" rx="2.5" fill="#a5b4fc" />
  <rect x="30" y="56" width="32" height="5" rx="2.5" fill="#a5b4fc" />
  
  <!-- Pencil icon in bottom corner -->
  <g transform="translate(56, 52) rotate(-15)">
    <rect x="0" y="0" width="12" height="26" rx="3" fill="url(#penGrad)" />
    <polygon points="0,26 6,34 12,26" fill="#fef3c7" />
    <polygon points="4,31 6,34 8,31" fill="#1e293b" />
  </g>
</svg>
